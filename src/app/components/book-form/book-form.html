<section>
    <form 
        [formGroup]="form" 
        (ngSubmit)= "onSubmit()" 
        class="flex flex-col gap-2 p-4">

        <mat-form-field appearance="outline">
            <mat-label> Title </mat-label>
            <input matInput formControlName="title" placeholder="Title">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label> Author </mat-label>
            <input matInput formControlName="author" placeholder="Author">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label> Cover image URL </mat-label>
            <input matInput formControlName="coverImg" placeholder="Image">
        </mat-form-field>
        <img *ngIf="form.value.coverImg" [src]="form.value.coverImg" class="w-40 rounded" />

        <mat-form-field appearance="outline">
            <mat-label> Description </mat-label>
            <textarea matInput formControlName="blurb" placeholder="Description"></textarea>
        </mat-form-field>


        <button type="submit">Add Book</button>
    </form>     
</section>
